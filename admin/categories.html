<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — XORONIQ Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div id="admin-sidebar-mount"></div>

<div class="admin-main">
    <header class="admin-header">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="admin-header-title">Categories Management</span>
        </div>
        <div class="admin-header-actions">
            <div class="admin-header-avatar" title="Admin">A</div>
        </div>
    </header>

    <div class="admin-content">
        <div style="display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start">
            
            <!-- Category Form -->
            <div class="form-card">
                <div class="form-card-header" id="cat-form-title">Add New Category</div>
                <div class="form-card-body">
                    <form id="category-form">
                        <div class="form-group">
                            <label class="form-label form-label-required" for="cat-name">Category Name</label>
                            <input type="text" class="form-input" id="cat-name" placeholder="e.g. Smart Electronics" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="cat-slug">URL Slug</label>
                            <input type="text" class="form-input" id="cat-slug" placeholder="e.g. electronics">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="cat-image">Cloudinary Image URL</label>
                            <input type="url" class="form-input" id="cat-image" placeholder="https://res.cloudinary.com/...">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="cat-desc">Description</label>
                            <textarea class="form-textarea" id="cat-desc" rows="3" placeholder="Brief category summary..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" id="save-cat-btn">Save Category</button>
                    </form>
                </div>
            </div>

            <!-- Categories Table -->
            <div class="admin-table-card">
                <div class="admin-table-header">
                    <h2 class="admin-table-title">Existing Categories</h2>
                    <span id="cat-count" style="font-size:13px;color:#666">0 Categories</span>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Icon/Image</th>
                                <th>Name</th>
                                <th>Slug</th>
                                <th>Products</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categories-tbody">
                            <tr><td colspan="5" class="table-empty">Loading categories...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module">
    import { initAdmin, getAdminSidebarHTML, showToast } from '/js/admin.js';
    import { getCategories, createCategory, deleteCategory } from '/js/db.js';

    let categories = [];

    async function init() {
        const user = await initAdmin();
        if (!user) return;

        document.getElementById('admin-sidebar-mount').innerHTML = getAdminSidebarHTML();
        initAdmin();

        await loadCategories();
        setupForm();
    }

    async function loadCategories() {
        const tbody = document.getElementById('categories-tbody');
        try {
            categories = await getCategories();
            document.getElementById('cat-count').textContent = `${categories.length} Categories`;
            if (!categories.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="table-empty">No categories created yet</td></tr>';
                return;
            }
            tbody.innerHTML = categories.map(c => `
            <tr>
                <td>
                    <img src="${c.imageUrl || '/img/placeholder.png'}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid #EAEAEA" alt="${c.name}">
                </td>
                <td><strong>${c.name}</strong></td>
                <td><code>${c.slug || c.id}</code></td>
                <td>${c.productCount || 0}</td>
                <td>
                    <div class="table-actions">
                        <button class="table-action-btn danger delete-cat-btn" data-id="${c.id}" title="Delete">🗑</button>
                    </div>
                </td>
            </tr>`).join('');

            document.querySelectorAll('.delete-cat-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    if (confirm('Delete this category? Products in this category will remain.')) {
                        try {
                            await deleteCategory(id);
                            showToast('Category deleted', 'success');
                            loadCategories();
                        } catch(e) {
                            showToast('Failed to delete', 'error');
                        }
                    }
                });
            });
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="5" class="table-empty">Failed to load categories</td></tr>';
        }
    }

    function setupForm() {
        const form = document.getElementById('category-form');
        const nameInput = document.getElementById('cat-name');
        const slugInput = document.getElementById('cat-slug');

        nameInput.addEventListener('input', () => {
            if (!slugInput.value || slugInput.dataset.manual !== 'true') {
                slugInput.value = nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            }
        });

        slugInput.addEventListener('input', () => {
            slugInput.dataset.manual = 'true';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const slug = slugInput.value.trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const imageUrl = document.getElementById('cat-image').value.trim();
            const description = document.getElementById('cat-desc').value.trim();

            if (!name) return;

            const saveBtn = document.getElementById('save-cat-btn');
            saveBtn.disabled = true;

            try {
                await createCategory({ name, slug, imageUrl, description, productCount: 0 });
                showToast('Category added!', 'success');
                form.reset();
                slugInput.dataset.manual = 'false';
                await loadCategories();
            } catch(err) {
                showToast('Failed to create category: ' + err.message, 'error');
            }
            saveBtn.disabled = false;
        });
    }

    init();
</script>
</body>
</html>
