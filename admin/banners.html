<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banners &amp; Promos — XORONIQ Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div id="admin-sidebar-mount"></div>

<div class="admin-main">
    <header class="admin-header">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="admin-header-title">Homepage Banners</span>
        </div>
        <div class="admin-header-actions">
            <div class="admin-header-avatar" title="Admin">A</div>
        </div>
    </header>

    <div class="admin-content">
        <div style="display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start">
            
            <div class="form-card">
                <div class="form-card-header">Add / Edit Banner</div>
                <div class="form-card-body">
                    <form id="banner-form">
                        <div class="form-group">
                            <label class="form-label form-label-required" for="banner-type">Banner Placement</label>
                            <select class="form-select" id="banner-type">
                                <option value="hero">Hero Main Banner</option>
                                <option value="promo">Mid-Page Promo Banner</option>
                                <option value="top_bar">Top Announcement Bar</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label form-label-required" for="banner-title">Heading Title</label>
                            <input type="text" class="form-input" id="banner-title" placeholder="e.g. Discover Products You'll Love" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="banner-subtitle">Subtitle / Highlight</label>
                            <input type="text" class="form-input" id="banner-subtitle" placeholder="e.g. Smart finds. Everyday essentials.">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="banner-btn-text">Button Text</label>
                            <input type="text" class="form-input" id="banner-btn-text" placeholder="SHOP NOW">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="banner-btn-link">Button Target Link</label>
                            <input type="text" class="form-input" id="banner-btn-link" placeholder="/shop.html">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="banner-img">Background Cloudinary Image URL</label>
                            <input type="url" class="form-input" id="banner-img" placeholder="https://res.cloudinary.com/...">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" id="save-banner-btn">Save Banner</button>
                    </form>
                </div>
            </div>

            <div class="admin-table-card">
                <div class="admin-table-header">
                    <h2 class="admin-table-title">Live Store Banners</h2>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Placement</th>
                                <th>Headline</th>
                                <th>Link</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="banners-tbody">
                            <tr><td colspan="4" class="table-empty">Loading banners...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module">
    import { initAdmin, getAdminSidebarHTML, showToast } from '/js/admin.js';
    import { getBanners, setBanner, deleteBanner } from '/js/db.js';

    let banners = [];

    async function init() {
        const user = await initAdmin();
        if (!user) return;

        document.getElementById('admin-sidebar-mount').innerHTML = getAdminSidebarHTML();
        initAdmin();

        await loadBanners();
        setupForm();
    }

    async function loadBanners() {
        const tbody = document.getElementById('banners-tbody');
        try {
            banners = await getBanners();
            if (!banners.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="table-empty">No active banners</td></tr>';
                return;
            }
            tbody.innerHTML = banners.map(b => `
            <tr>
                <td><span class="badge badge-primary">${b.type || 'hero'}</span></td>
                <td>
                    <strong>${b.title || 'Untitled'}</strong>
                    <div style="font-size:11px;color:#666">${b.subtitle || ''}</div>
                </td>
                <td><code>${b.buttonLink || '/'}</code></td>
                <td>
                    <button class="table-action-btn danger delete-banner-btn" data-id="${b.id}" title="Delete">🗑</button>
                </td>
            </tr>`).join('');

            document.querySelectorAll('.delete-banner-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Delete banner?')) {
                        try {
                            await deleteBanner(btn.dataset.id);
                            showToast('Banner removed', 'success');
                            loadBanners();
                        } catch(e) {
                            showToast('Delete failed', 'error');
                        }
                    }
                });
            });
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="4" class="table-empty">Unable to fetch banners</td></tr>';
        }
    }

    function setupForm() {
        const form = document.getElementById('banner-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('banner-type').value;
            const title = document.getElementById('banner-title').value.trim();
            const subtitle = document.getElementById('banner-subtitle').value.trim();
            const buttonText = document.getElementById('banner-btn-text').value.trim() || 'SHOP NOW';
            const buttonLink = document.getElementById('banner-btn-link').value.trim() || '/shop.html';
            const imageUrl = document.getElementById('banner-img').value.trim();

            const btn = document.getElementById('save-banner-btn');
            btn.disabled = true;

            try {
                await setBanner(type, { type, title, subtitle, buttonText, buttonLink, imageUrl, isActive: true });
                showToast('Banner saved!', 'success');
                form.reset();
                await loadBanners();
            } catch(err) {
                showToast('Failed to save banner', 'error');
            }
            btn.disabled = false;
        });
    }

    init();
</script>
</body>
</html>
