<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products List — XORONIQ Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div id="admin-sidebar-mount"></div>

<div class="admin-main">
    <header class="admin-header">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="admin-header-title">Products Inventory</span>
        </div>
        <div class="admin-header-actions">
            <a href="/admin/product-form.html" class="btn btn-primary btn-sm">+ Add New Product</a>
            <div class="admin-header-avatar" title="Admin">A</div>
        </div>
    </header>

    <div class="admin-content">
        <div class="admin-table-card">
            <div class="admin-table-header">
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <input type="text" class="admin-search-input" id="table-search" placeholder="Search by name, SKU...">
                    <select class="form-select" id="filter-category" style="width:160px;padding:6px 12px;font-size:13px">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="admin-table-actions">
                    <span id="product-count-label" style="font-size:13px;color:#666">0 Products</span>
                </div>
            </div>

            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Product Info</th>
                            <th>Category</th>
                            <th>MRP</th>
                            <th>Selling Price</th>
                            <th>Discount</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr>
                            <td colspan="8" class="table-empty">
                                <div class="table-empty-icon">⏳</div>
                                <div class="table-empty-text">Loading catalog...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initAdmin, getAdminSidebarHTML, showToast, formatPrice } from '/js/admin.js';
    import { getProducts, getCategories, deleteProduct, updateProduct } from '/js/db.js';

    let allProducts = [];
    let categoriesList = [];

    async function init() {
        const user = await initAdmin();
        if (!user) return;

        document.getElementById('admin-sidebar-mount').innerHTML = getAdminSidebarHTML();
        initAdmin();

        await loadCategories();
        await loadProductsList();
        setupFiltersAndSearch();
    }

    async function loadCategories() {
        try {
            categoriesList = await getCategories();
            const select = document.getElementById('filter-category');
            select.innerHTML = '<option value="">All Categories</option>' +
                categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        } catch(e) {
            console.error(e);
        }
    }

    async function loadProductsList() {
        const tbody = document.getElementById('products-tbody');
        try {
            const { products } = await getProducts({ pageSize: 100, sortField: 'createdAt', sortDir: 'desc' });
            allProducts = products;
            renderTable(allProducts);
        } catch(e) {
            tbody.innerHTML = `<tr><td colspan="8" class="table-empty"><div class="table-empty-icon">⚠</div><div class="table-empty-text">Failed to load products</div></td></tr>`;
        }
    }

    function renderTable(items) {
        const tbody = document.getElementById('products-tbody');
        const countLabel = document.getElementById('product-count-label');
        countLabel.textContent = `${items.length} Product${items.length === 1 ? '' : 's'}`;

        if (!items.length) {
            tbody.innerHTML = `<tr><td colspan="8" class="table-empty"><div class="table-empty-icon">📦</div><div class="table-empty-text">No products found</div></td></tr>`;
            return;
        }

        tbody.innerHTML = items.map(p => `
        <tr data-id="${p.id}">
            <td>
                <div style="display:flex;align-items:center;gap:12px">
                    <img class="table-product-img" src="${p.primaryImage || '/img/placeholder.png'}" alt="${p.name}" loading="lazy">
                    <div class="table-product-info">
                        <div class="table-product-name" title="${p.name}">${p.name}</div>
                        <div class="table-product-sku">SKU: ${p.sku || 'N/A'}</div>
                    </div>
                </div>
            </td>
            <td>${p.categoryName || 'General'}</td>
            <td>${formatPrice(p.mrp)}</td>
            <td><strong>${formatPrice(p.sellingPrice)}</strong></td>
            <td><span class="badge badge-success">${p.discountPercentage || 0}% OFF</span></td>
            <td>
                <span style="font-weight:700;color:${p.stock > 5 ? '#16A34A' : p.stock > 0 ? '#D97706' : '#DC2626'}">
                    ${p.stock ?? 0}
                </span>
            </td>
            <td>
                <button class="status-toggle-btn badge ${p.isActive ? 'badge-success' : 'badge-error'}" data-id="${p.id}" data-active="${p.isActive}" style="cursor:pointer;border:none">
                    ${p.isActive ? 'Active' : 'Inactive'}
                </button>
            </td>
            <td>
                <div class="table-actions">
                    <a class="table-action-btn" href="/admin/product-form.html?id=${p.id}" title="Edit">✎</a>
                    <a class="table-action-btn" href="/product.html?id=${p.id}" target="_blank" title="View Store Page">↗</a>
                    <button class="table-action-btn danger delete-btn" data-id="${p.id}" title="Delete Product">🗑</button>
                </div>
            </td>
        </tr>`).join('');

        attachActionListeners();
    }

    function attachActionListeners() {
        // Toggle Active
        document.querySelectorAll('.status-toggle-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const currentStatus = btn.dataset.active === 'true';
                try {
                    await updateProduct(id, { isActive: !currentStatus });
                    showToast(`Product ${!currentStatus ? 'Activated' : 'Deactivated'}`);
                    btn.dataset.active = (!currentStatus).toString();
                    btn.textContent = !currentStatus ? 'Active' : 'Inactive';
                    btn.className = `status-toggle-btn badge ${!currentStatus ? 'badge-success' : 'badge-error'}`;
                } catch(e) {
                    showToast('Failed to update status', 'error');
                }
            });
        });

        // Delete
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                if (confirm('Are you sure you want to delete this product?')) {
                    try {
                        await deleteProduct(id);
                        showToast('Product deleted', 'success');
                        allProducts = allProducts.filter(p => p.id !== id);
                        renderTable(allProducts);
                    } catch(e) {
                        showToast('Failed to delete product', 'error');
                    }
                }
            });
        });
    }

    function setupFiltersAndSearch() {
        const searchInput = document.getElementById('table-search');
        const catSelect = document.getElementById('filter-category');

        function filterData() {
            const query = searchInput.value.toLowerCase().trim();
            const cat = catSelect.value;

            const filtered = allProducts.filter(p => {
                const matchesQuery = !query || p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query));
                const matchesCat = !cat || p.categoryId === cat;
                return matchesQuery && matchesCat;
            });

            renderTable(filtered);
        }

        searchInput.addEventListener('input', filterData);
        catSelect.addEventListener('change', filterData);
    }

    init();
</script>
</body>
</html>
