<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers — XORONIQ Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div id="admin-sidebar-mount"></div>

<div class="admin-main">
    <header class="admin-header">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="admin-header-title">Registered Customers</span>
        </div>
        <div class="admin-header-actions">
            <div class="admin-header-avatar" title="Admin">A</div>
        </div>
    </header>

    <div class="admin-content">
        <div class="admin-table-card">
            <div class="admin-table-header">
                <input type="text" class="admin-search-input" id="customer-search" placeholder="Search by name, email...">
                <span id="customer-count" style="font-size:13px;color:#666">0 Customers</span>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Joined Date</th>
                        </tr>
                    </thead>
                    <tbody id="customers-tbody">
                        <tr><td colspan="5" class="table-empty">Loading customers...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initAdmin, getAdminSidebarHTML, formatDate } from '/js/admin.js';
    import { getCustomers } from '/js/db.js';

    let customers = [];

    async function init() {
        const user = await initAdmin();
        if (!user) return;

        document.getElementById('admin-sidebar-mount').innerHTML = getAdminSidebarHTML();
        initAdmin();

        await loadCustomers();
        
        document.getElementById('customer-search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const filtered = customers.filter(c => 
                (c.name && c.name.toLowerCase().includes(q)) || 
                (c.email && c.email.toLowerCase().includes(q)) ||
                (c.phone && c.phone.includes(q))
            );
            renderTable(filtered);
        });
    }

    async function loadCustomers() {
        const tbody = document.getElementById('customers-tbody');
        try {
            customers = await getCustomers();
            renderTable(customers);
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="5" class="table-empty">Unable to fetch customer profiles</td></tr>';
        }
    }

    function renderTable(items) {
        const tbody = document.getElementById('customers-tbody');
        document.getElementById('customer-count').textContent = `${items.length} Customers`;

        if (!items.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="table-empty">No customers found</td></tr>';
            return;
        }

        tbody.innerHTML = items.map(c => `
        <tr>
            <td>
                <div style="display:flex;align-items:center;gap:10px">
                    <div class="admin-header-avatar" style="width:32px;height:32px;font-size:12px">
                        ${(c.name || c.email || 'U')[0].toUpperCase()}
                    </div>
                    <strong>${c.name || 'Anonymous User'}</strong>
                </div>
            </td>
            <td>${c.email || '—'}</td>
            <td>${c.phone || '—'}</td>
            <td><span class="badge ${c.role === 'admin' ? 'badge-primary' : 'badge-secondary'}">${c.role || 'customer'}</span></td>
            <td>${formatDate(c.createdAt)}</td>
        </tr>`).join('');
    }

    init();
</script>
</body>
</html>
