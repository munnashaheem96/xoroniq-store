<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews — XORONIQ Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div id="admin-sidebar-mount"></div>

<div class="admin-main">
    <header class="admin-header">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="admin-mobile-toggle" id="admin-mobile-toggle" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="admin-header-title">Review Moderation</span>
        </div>
        <div class="admin-header-actions">
            <div class="admin-header-avatar" title="Admin">A</div>
        </div>
    </header>

    <div class="admin-content">
        <div class="admin-table-card">
            <div class="admin-table-header">
                <h2 class="admin-table-title">Customer Feedback &amp; Ratings</h2>
                <span id="review-count" style="font-size:13px;color:#666">0 Reviews</span>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Product ID / Name</th>
                            <th>Customer</th>
                            <th>Rating</th>
                            <th>Review</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reviews-tbody">
                        <tr><td colspan="7" class="table-empty">Loading reviews...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initAdmin, getAdminSidebarHTML, showToast, formatDate } from '/js/admin.js';
    import { getReviews, approveReview, deleteReview } from '/js/db.js';

    let reviews = [];

    async function init() {
        const user = await initAdmin();
        if (!user) return;

        document.getElementById('admin-sidebar-mount').innerHTML = getAdminSidebarHTML();
        initAdmin();

        await loadReviews();
    }

    async function loadReviews() {
        const tbody = document.getElementById('reviews-tbody');
        try {
            const res = await getReviews({ approvedOnly: false, pageSize: 100 });
            reviews = res.reviews || [];
            document.getElementById('review-count').textContent = `${reviews.length} Reviews`;

            if (!reviews.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="table-empty">No reviews submitted yet</td></tr>';
                return;
            }

            tbody.innerHTML = reviews.map(r => `
            <tr>
                <td><code>${r.productId}</code></td>
                <td><strong>${r.userName || 'Anonymous'}</strong></td>
                <td><span style="color:#F59E0B">★</span> ${r.rating} / 5</td>
                <td>
                    <strong>${r.title || ''}</strong>
                    <div style="font-size:12px;color:#666;max-width:300px">${r.comment || ''}</div>
                </td>
                <td><small>${formatDate(r.createdAt)}</small></td>
                <td>
                    <span class="badge ${r.isApproved ? 'badge-success' : 'badge-warning'}">
                        ${r.isApproved ? 'Approved' : 'Pending'}
                    </span>
                </td>
                <td>
                    <div class="table-actions">
                        ${!r.isApproved ? `<button class="table-action-btn success approve-btn" data-id="${r.id}" title="Approve">✓</button>` : ''}
                        <button class="table-action-btn danger delete-btn" data-id="${r.id}" title="Delete">🗑</button>
                    </div>
                </td>
            </tr>`).join('');

            document.querySelectorAll('.approve-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    try {
                        await approveReview(btn.dataset.id);
                        showToast('Review approved!', 'success');
                        await loadReviews();
                    } catch(e) {
                        showToast('Approval failed', 'error');
                    }
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Delete review?')) {
                        try {
                            await deleteReview(btn.dataset.id);
                            showToast('Review deleted', 'success');
                            await loadReviews();
                        } catch(e) {
                            showToast('Delete failed', 'error');
                        }
                    }
                });
            });

        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="7" class="table-empty">Unable to fetch reviews</td></tr>';
        }
    }

    init();
</script>
</body>
</html>
